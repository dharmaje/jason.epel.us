<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Jason Epel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script>
  // Apply the saved theme before first paint (dark is the default).
  (function () {
    var t = sessionStorage.getItem("adm_theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<!-- Login header — the pre-sign-in chrome is deliberately unchanged -->
<header id="loginHeader" class="top">
  <div class="wordmark">Jason <span class="accent">Epel</span></div>
  <div class="top-right">
    <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
      <span class="ic-sun">☀</span><span class="ic-moon">☾</span>
    </button>
  </div>
</header>

<!-- App header (david.epel.us admin look: always-dark gradient bar) -->
<header id="appHeader" class="hdr hidden">
  <span class="brand">Jason <span>Epel</span></span>
  <span class="tag">Publishing Admin</span>
  <span class="spacer"></span>
  <button id="themeToggleApp" class="iconbtn themebtn" data-tip="Switch theme" aria-label="Toggle theme">
    <span id="themeIcon" class="material-icons-outlined">light_mode</span>
  </button>
  <span class="user"><span id="userAvatar" class="avatar">J</span><span id="userName">Jason</span></span>
  <button id="logoutBtn" class="signout">Sign out</button>
</header>

<!-- Login (world-readable page: copy stays vague) -->
<main id="loginView" class="login hidden">
  <form id="loginForm" autocomplete="off">
    <h1 id="loginTitle">Sign in.</h1>
    <div id="portrait" class="portrait hidden">
      <img id="portraitImg" src="me.jpg" alt="" draggable="false">
      <button type="button" id="forehead" class="forehead" aria-label="Sign in"></button>
    </div>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" id="loginSubmit">Sign in</button>
    <p id="loginError" class="login-error" role="alert"></p>
  </form>
</main>

<!-- App -->
<main id="appView" class="wrap hidden">
  <div class="toolbar">
    <h1>Pages</h1>
    <span class="grow"></span>
    <div class="search">
      <span class="material-icons-outlined">search</span>
      <input id="search" type="search" placeholder="Filter by slug or title…" aria-label="Filter pages">
    </div>
    <button id="uploadBtn" class="btn btn-primary">
      <span class="material-icons-outlined">add</span> Upload New Page
    </button>
  </div>

  <section id="pendingStrip" class="pending-strip hidden"></section>

  <div class="card">
    <div class="tablewrap">
      <table id="pagesTable">
        <thead>
          <tr>
            <th class="th-click" data-sort="slug">Page<span class="tharrow"></span></th>
            <th class="th-click" id="statusTh">Status<span class="material-icons-outlined thfilter">filter_list</span></th>
            <th>Notes</th>
            <th>Public URL</th>
            <th>Access Code</th>
            <th>Size</th>
            <th class="th-click" data-sort="last_published">Last Published<span class="tharrow"></span></th>
            <th class="th-right">Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="emptyState" class="empty hidden"></div>
    </div>
    <div id="pager" class="pager"></div>
  </div>
</main>

<!-- Modals -->
<div id="modalBackdrop" class="scrim hidden">
  <div id="modalBox" class="modal" role="dialog" aria-modal="true"></div>
</div>

<div id="toasts" class="toasts"></div>

<script src="admin.js"></script>
</body>
</html>
